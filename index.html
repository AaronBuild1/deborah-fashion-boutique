<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deborah Fashion Boutique — Mode femme africaine contemporaine. Robes, ensembles et pièces signature, livraison partout en RDC." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>" />
    <title>Deborah Fashion Boutique — Mode femme</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Affiche les erreurs JS visuellement au lieu d'un ecran blanc silencieux
      window.addEventListener('error', function (e) {
        var el = document.getElementById('build-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'build-error';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fff;padding:16px;font-size:12px;white-space:pre-wrap;margin:0;';
          document.body && document.body.appendChild(el);
        }
        el.textContent = 'Erreur JS: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('build-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'build-error';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fff;padding:16px;font-size:12px;white-space:pre-wrap;margin:0;';
          document.body && document.body.appendChild(el);
        }
        el.textContent = 'Erreur: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
